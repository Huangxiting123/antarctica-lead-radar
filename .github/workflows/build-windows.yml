name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "src/**"
      - "requirements-dev.txt"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install builder
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build portable EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "OmniMediaIntelligenceRadar" app.py

      - name: Build source bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release\OmniMediaIntelligenceRadar | Out-Null
          Copy-Item app.py,README.md,PRIVACY.md,run_windows.bat,build_windows.ps1,requirements-dev.txt release\OmniMediaIntelligenceRadar
          Copy-Item src,sample,tests release\OmniMediaIntelligenceRadar -Recurse
          Get-ChildItem release\OmniMediaIntelligenceRadar -Recurse -Directory -Filter __pycache__ | Remove-Item -Recurse -Force
          Get-ChildItem release\OmniMediaIntelligenceRadar -Recurse -File -Filter *.pyc | Remove-Item -Force
          Compress-Archive -Path release\OmniMediaIntelligenceRadar -DestinationPath dist\OmniMediaIntelligenceRadar-source.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniMediaIntelligenceRadar-Windows
          path: |
            dist/OmniMediaIntelligenceRadar.exe
            dist/OmniMediaIntelligenceRadar-source.zip

      - name: Publish or update release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "omnimedia-intelligence-radar-v0.2.0"
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "OmniMedia Intelligence Radar v0.2.0" --notes "Cross-platform public-content and lead intelligence desktop app. Official APIs, authorized-account data, compliant imports, configurable projects, regions and languages, with human-reviewed replies."
          }
          gh release upload $tag dist\OmniMediaIntelligenceRadar.exe dist\OmniMediaIntelligenceRadar-source.zip --clobber
